services:
  certificates:
    image: motoserver/moto:5.2.0@sha256:d8d063e3e704d256cbe8165072fa273c17698be91311e49fc602b7716f459bea
    entrypoint: [python, /fixture/certificates.py]
    network_mode: none
    volumes:
      [
        trust:/trust,
        source-tls:/source,
        target-tls:/target,
        '../tls-admission/certificates.py:/fixture/certificates.py:ro',
      ]
    mem_limit: 128m
    cpus: 1
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command:
      [
        postgres,
        -c,
        ssl=on,
        -c,
        ssl_cert_file=/tls/server.valid.crt,
        -c,
        ssl_key_file=/tls/server.key,
      ]
    depends_on:
      certificates: { condition: service_completed_successfully }
    volumes: [postgres-data:/var/lib/postgresql, source-tls:/tls:ro, recovery-work:/recovery]
    networks:
      local:
        aliases: [postgres.preflight.test, postgres.mismatch.preflight.test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d postgres']
      interval: 1s
      timeout: 2s
      retries: 40
    mem_limit: 512m
    cpus: 1
  recovery-postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command:
      [
        postgres,
        -c,
        ssl=on,
        -c,
        ssl_cert_file=/tls/server.valid.crt,
        -c,
        ssl_key_file=/tls/server.key,
      ]
    depends_on:
      certificates: { condition: service_completed_successfully }
    volumes:
      [recovery-postgres-data:/var/lib/postgresql, target-tls:/tls:ro, recovery-work:/recovery]
    networks:
      local:
        aliases: [recovery-postgres.preflight.test, recovery-postgres.mismatch.preflight.test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d postgres']
      interval: 1s
      timeout: 2s
      retries: 40
    mem_limit: 512m
    cpus: 1
  setup:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment:
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      FIXTURE_GENERATION: ${FIXTURE_GENERATION:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TEST_DATABASE_URL: postgresql://local_harness:${POSTGRES_PASSWORD:?}@postgres:5432/tt_app
      TEST_CMS_DATABASE_URL: postgresql://local_harness:${POSTGRES_PASSWORD:?}@postgres:5432/tt_cms
      HANDOFF_PROFILE: ${HANDOFF_PROFILE:?}
      HANDOFF_IMAGE: ${HANDOFF_IMAGE:?}
      HANDOFF_CONFIG: ${HANDOFF_CONFIG:?}
    command: [node, --import, tsx, tests/fixtures/restore-handoff/prepare.ts]
    volumes:
      [
        owners:/owners,
        trust:/trust:ro,
        recovery-work:/recovery,
        custody-keys:/custody-keys,
        custody-backup:/custody-backup,
        custody-journal:/custody-journal,
        handoff-meta:/handoff-meta,
        handoff-current:/handoff-current,
      ]
    networks: [local]
    read_only: true
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=128m',
        '/workspace/node_modules/.vite-temp:rw,noexec,nosuid,size=32m',
        '/workspace/node_modules/.vite:rw,noexec,nosuid,size=16m',
        '/workspace/node_modules/.vitest:rw,noexec,nosuid,size=1m',
        '/workspace/node_modules/.vitest-cache:rw,noexec,nosuid,size=64m',
      ]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
  observer: &observer
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment: &public-env
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      HANDOFF_IMAGE: ${HANDOFF_IMAGE:?}
      HANDOFF_CONFIG: ${HANDOFF_CONFIG:?}
    command: [node, --import, tsx, tests/fixtures/restore-handoff/observe.ts]
    volumes:
      [
        owners:/owners:ro,
        trust:/trust:ro,
        handoff-meta:/handoff-meta:ro,
        handoff-current:/handoff-current:ro,
      ]
    networks: [local]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
  observer-loss:
    <<: *observer
    environment:
      <<: *public-env
      HANDOFF_OBSERVER_MODE: loss
  audit:
    <<: *observer
    command: [node, --import, tsx, tests/fixtures/restore-handoff/audit.ts]
  write-probe:
    <<: *observer
    command: [node, --import, tsx, tests/fixtures/restore-handoff/write-denial.ts]
volumes:
  postgres-data:
  recovery-postgres-data:
  source-tls:
  target-tls:
  trust:
  owners:
  recovery-work:
  custody-keys:
  custody-backup:
  custody-journal:
  handoff-meta:
  handoff-current:
networks:
  local: { internal: true }
