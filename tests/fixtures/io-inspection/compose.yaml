services:
  certificates:
    image: motoserver/moto:5.2.0@sha256:d8d063e3e704d256cbe8165072fa273c17698be91311e49fc602b7716f459bea
    entrypoint: [python, /fixture/certificates.py]
    network_mode: none
    volumes:
      [
        trust:/trust,
        source-tls:/source,
        target-tls:/target,
        '../tls-admission/certificates.py:/fixture/certificates.py:ro',
      ]
    mem_limit: 128m
    cpus: 1
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command:
      [
        postgres,
        -c,
        'ssl=${SOURCE_SSL:-on}',
        -c,
        'ssl_cert_file=/tls/server.${SOURCE_CERT:-valid}.crt',
        -c,
        ssl_key_file=/tls/server.key,
      ]
    depends_on:
      certificates: { condition: service_completed_successfully }
    volumes: [postgres-data:/var/lib/postgresql, source-tls:/tls:ro]
    networks:
      local:
        aliases: [postgres.preflight.test, postgres.mismatch.preflight.test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d postgres']
      interval: 1s
      timeout: 2s
      retries: 40
    mem_limit: 512m
    cpus: 1
  recovery-postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    command:
      [
        postgres,
        -c,
        ssl=on,
        -c,
        ssl_cert_file=/tls/server.valid.crt,
        -c,
        ssl_key_file=/tls/server.key,
      ]
    depends_on:
      certificates: { condition: service_completed_successfully }
    volumes: [recovery-postgres-data:/var/lib/postgresql, target-tls:/tls:ro]
    networks:
      local:
        aliases: [recovery-postgres.preflight.test, recovery-postgres.mismatch.preflight.test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d postgres']
      interval: 1s
      timeout: 2s
      retries: 40
    mem_limit: 512m
    cpus: 1
  setup:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment:
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      FIXTURE_GENERATION: ${FIXTURE_GENERATION:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: [node, tests/fixtures/multitarget-coordination/setup.ts]
    volumes: [owners:/owners, trust:/trust:ro, admin:/admin]
    networks: [local]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
  supervisor:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    command: [node, tests/fixtures/multitarget-coordination/resource-supervisor.ts]
    # Trusted custodian reads UID-999/0600 synthetic keys; observer gets no capability.
    cap_add: [DAC_OVERRIDE]
    network_mode: none
    volumes:
      [
        control:/control,
        owners:/owners:ro,
        trust:/trust:ro,
        source-tls:/custody/source:ro,
        target-tls:/custody/target:ro,
        '${BINDING_FILE:?}:/binding.json:ro',
        '/var/run/docker.sock:/var/run/docker.sock:ro',
      ]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
  inspector:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment:
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      MC_PROFILE: standard
    command: [node, tests/fixtures/multitarget-coordination/inspector.ts]
    volumes: [owners:/owners:ro, trust:/trust:ro, admin:/admin:ro, control:/control, fault:/fault]
    networks: [local]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 2
  route-custody:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment:
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      FIXTURE_GENERATION: ${FIXTURE_GENERATION:?}
    command: [node, tests/fixtures/io-inspection/route-custody.ts]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes: ['${BINDING_FILE:?}:/binding.json:ro', routes:/routes]
    mem_limit: 128m
    cpus: 1
  observer:
    image: tiresandtreads-tooling:${TOOLING_TAG:?}
    environment:
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      MC_PROFILE: standard
      IO_PROFILE: ${IO_PROFILE:?}
    command: [pnpm, exec, vitest, run, --config, tests/fixtures/io-inspection/vitest.config.ts]
    volumes: [owners:/owners:ro, trust:/trust:ro, control:/control:ro, routes:/routes:ro]
    extra_hosts: ['postgres.preflight.test=127.0.0.1', 'recovery-postgres.preflight.test=127.0.0.2']
    networks: [local]
    read_only: true
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=64m',
        '/workspace/node_modules/.vite-temp:rw,noexec,nosuid,size=32m',
        '/workspace/node_modules/.vite:rw,noexec,nosuid,size=16m',
        '/workspace/node_modules/.vitest:rw,noexec,nosuid,size=1m',
        '/workspace/node_modules/.vitest-cache:rw,noexec,nosuid,size=64m',
      ]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
volumes:
  postgres-data:
  recovery-postgres-data:
  source-tls:
  target-tls:
  trust:
  owners:
  control:
  admin:
  fault:
  routes:
networks:
  local:
    internal: true
