name: Dedicated populated preservation proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: populated-preservation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  populated-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Populated source/target observations, refusals and owned cleanup
        run: node tests/fixtures/populated-preservation/run.mjs
