name: Dedicated fixture TLS admission
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fixture-tls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tls-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bounded synthetic setup, read-only observations and owned teardown
        run: node tests/fixtures/tls-admission/run.mjs
