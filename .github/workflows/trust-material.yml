name: Dedicated trust root and material refusals
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: trust-material-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trust-material:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed synthetic trust and custody faults with exact owned teardown
        run: node tests/fixtures/trust-material/run.mjs
