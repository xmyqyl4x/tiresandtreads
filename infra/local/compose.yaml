services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local env file first}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${DATABASE_PORT:?}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d tt_app']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    networks: [local]
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-working}
    image: tiresandtreads-local:${COMPOSE_PROJECT_NAME:?}
    environment:
      APP_ENV: ${APP_ENV:?}
      PROVIDER_MODE: fixtures
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:${APP_PORT:?}:3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 20s
    networks: [local]
  database:
    profiles: [database]
    image: tiresandtreads-tooling:${COMPOSE_PROJECT_NAME:?}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: tooling
    environment:
      APP_ENV: ${APP_ENV:?}
    env_file:
      - path: ../../.local/db-${LOCAL_ENV:?}.env
        required: false
      - path: ../../.local/db-admin-${LOCAL_ENV:?}.env
        required: false
    command: [pnpm, exec, tsx, scripts/database/cli.ts, status]
    mem_limit: 1536m
    cpus: 2
    networks: [local]
  test:
    image: tiresandtreads-tooling:${COMPOSE_PROJECT_NAME:?}
    profiles: [verify]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: tooling
    environment:
      APP_ENV: test-local
      PROVIDER_MODE: fixtures
      ISOLATED_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:?}
      TEST_DATABASE_URL: postgresql://local_harness:${POSTGRES_PASSWORD:?}@postgres:5432/tt_app
      TEST_CMS_DATABASE_URL: postgresql://local_harness:${POSTGRES_PASSWORD:?}@postgres:5432/tt_cms
      TEST_BASE_URL: http://app:3000
      TEST_STORAGE_ENDPOINT: http://moto:5000
      TEST_WORKFLOW_ENDPOINT: http://inngest:8288
    command: [pnpm, test:db]
    mem_limit: 1536m
    cpus: 2
    networks: [local]
  moto:
    profiles: [verify, providers]
    image: motoserver/moto:5.2.0@sha256:d8d063e3e704d256cbe8165072fa273c17698be91311e49fc602b7716f459bea
    environment:
      MOTO_PORT: '5000'
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    networks: [local]
  inngest:
    profiles: [verify, providers]
    image: inngest/inngest@sha256:ad551e89e493e34db74d155be37dc5549930fcb6eb8382e502c17da9762821c7
    command:
      [
        inngest,
        dev,
        --host,
        '0.0.0.0',
        --no-discovery,
        --no-poll,
        -u,
        'http://test:8123/internal/inngest',
      ]
    mem_limit: 512m
    cpus: 1
    networks: [local]
volumes:
  postgres-data:
networks:
  local:
    driver: bridge
