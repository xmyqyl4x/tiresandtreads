services:
  recovery-postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: local_harness
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - recovery-postgres-data:/var/lib/postgresql
      - recovery-work:/recovery
      - ./01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_harness -d tt_app']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    networks: [local]
  postgres:
    volumes:
      - recovery-work:/recovery
  test:
    volumes:
      - recovery-work:/recovery
volumes:
  recovery-postgres-data:
  recovery-work:
