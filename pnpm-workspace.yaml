packages:
  - apps/*
  - packages/*
saveExact: true
strictPeerDependencies: true
overrides:
  '@opentelemetry/api': 1.9.0
  # Payload's older toolchain must not select Vite's incompatible optional peer.
  'vite>esbuild': 0.28.2
  # Temporary transitive security pins; re-evaluate with the next Payload update.
  'monaco-editor>dompurify': 3.4.17
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # GHSA-x8rm-f576-gq67: use the reviewed fixed release without suppressing audit.
  '@payloadcms/graphql>graphql-scalars': 2.0.1
minimumReleaseAge: 1440
# Reviewed framework patch published today; exact version is locked and tested.
minimumReleaseAgeExclude:
  - next@16.4.3
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  protobufjs: false
